<style>
*{box-sizing:border-box}html,body{margin:0;background:#f7e9e4}
.wrap{width:min(100%,680px);margin:auto;position:relative;line-height:0}
.art{width:100%;height:auto;display:block}
.counter{position:absolute;left:10.9%;right:10.9%;top:48.55%;height:8.15%;display:grid;grid-template-columns:repeat(4,1fr);gap:2.2%}
.unit{background:rgba(255,248,245,.99);border-radius:15%;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.num{color:#c86470;font-family:Georgia,"Times New Roman",serif;font-size:clamp(24px,7.2vw,49px);font-weight:700;line-height:1}
.lab{margin-top:9%;color:#985a59;font-family:Georgia,"Times New Roman",serif;font-size:clamp(7px,2.15vw,14px);letter-spacing:.08em;line-height:1}
.event-info{position:absolute;left:15%;right:15%;top:57.1%;height:5.15%;background:#f8dcd8;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:18px;color:#945954;font-family:Georgia,"Times New Roman",serif;line-height:1.15;z-index:3}
.event-date{font-size:clamp(9px,2.55vw,17px);font-weight:700;letter-spacing:.02em;white-space:nowrap}
.event-time{margin-top:6px;font-size:clamp(10px,2.7vw,18px);font-weight:700;letter-spacing:.04em}
.gift-link{position:absolute;left:21.2%;right:20.6%;top:76.08%;height:8.2%;border-radius:999px;z-index:4;text-indent:-9999px;overflow:hidden}
.gift-link:focus{outline:3px solid #fff;outline-offset:-6px}
@media(min-width:681px){.num{font-size:49px}.lab{font-size:14px}.event-date{font-size:17px}.event-time{font-size:18px}}
</style>
</head>
<body>
<main class="wrap">
<img class="art" src="diseno-lia.png" alt="Baby Shower de Lía Sofía. Gracias por confirmar.">
<div class="counter" aria-label="Cuenta regresiva para el Baby Shower">
<div class="unit"><span class="num" id="d">--</span><span class="lab">DÍAS</span></div>
<div class="unit"><span class="num" id="h">--</span><span class="lab">HORAS</span></div>
<div class="unit"><span class="num" id="m">--</span><span class="lab">MINUTOS</span></div>
<div class="unit"><span class="num" id="s">--</span><span class="lab">SEGUNDOS</span></div>
</div>
<div class="event-info"><div class="event-date">📅 &nbsp; SÁBADO 10 DE OCTUBRE DE 2026</div><div class="event-time">◷ &nbsp; 14:00 HRS</div></div>
<a class="gift-link" href="https://docs.google.com/spreadsheets/d/e/2PACX-1vQSssn795x5kZGUItYj5POCGcacanBCjjxdwNEQhN3Z2sr3Tgf5sjMaiq9su8aScLnK9B4_MZlOv4BY/pubhtml?gid=63163161&single=true" target="_blank" rel="noopener noreferrer" aria-label="Ver lista de regalos de Lía Sofía">Ver lista de regalos</a>
</main>
<script>
const target=new Date("2026-10-10T14:00:00-03:00").getTime();
function tick(){let x=target-Date.now();if(x<=0){["d","h","m","s"].forEach(i=>document.getElementById(i).textContent="00");return}
const D=86400000,H=3600000,M=60000;const d=Math.floor(x/D);x%=D;const h=Math.floor(x/H);x%=H;const m=Math.floor(x/M);x%=M;const s=Math.floor(x/1000);
[["d",d],["h",h],["m",m],["s",s]].forEach(([i,v])=>document.getElementById(i).textContent=String(v).padStart(2,"0"))}
tick();setInterval(tick,1000);
</script>
