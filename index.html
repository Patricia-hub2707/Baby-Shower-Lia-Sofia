<style>
*{box-sizing:border-box}html,body{margin:0;background:#f7e9e4}
.wrap{width:min(100%,680px);margin:auto;position:relative;line-height:0}
.art{width:100%;height:auto;display:block}
.counter{position:absolute;left:10.9%;right:10.9%;top:48.55%;height:8.15%;display:grid;grid-template-columns:repeat(4,1fr);gap:2.2%}
.unit{background:rgba(255,248,245,.99);border-radius:15%;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.num{color:#c86470;font-family:Georgia,"Times New Roman",serif;font-size:clamp(24px,7.2vw,49px);font-weight:700;line-height:1}
.lab{margin-top:9%;color:#985a59;font-family:Georgia,"Times New Roman",serif;font-size:clamp(7px,2.15vw,14px);letter-spacing:.08em;line-height:1}
.event-info{position:absolute;left:15%;right:15%;top:57.1%;height:5.15%;background:#f8dcd8;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:18px;color:#945954;font-family:Georgia,"Times New Roman",serif;line-height:1.15;z-index:3}
.event-date{font-size:clamp(9px,2.55vw,17px);font-weight:700;letter-spacing:.02em;white-space:nowrap}
.event-time{margin-top:6px;font-size:clamp(10px,2.7vw,18px);font-weight:700;letter-spacing:.04em}
.gift-link{position:absolute;left:21.2%;right:20.6%;top:76.08%;height:8.2%;border-radius:999px;z-index:4;text-indent:-9999px;overflow:hidden}
.gift-link:focus{outline:3px solid #fff;outline-offset:-6px}
@media(min-width:681px){.num{font-size:49px}.lab{font-size:14px}.event-date{font-size:17px}.event-time{font-size:18px}}
</style>

<style>
#listaModal{position:fixed;inset:0;background:rgba(73,45,42,.58);z-index:9999;display:none;align-items:flex-end;justify-content:center;line-height:1.35}
#listaModal.abierto{display:flex}
.lista-panel{width:min(100%,680px);height:min(92vh,900px);background:#fffaf5;border-radius:28px 28px 0 0;padding:18px 14px 26px;overflow:auto;font-family:Georgia,"Times New Roman",serif;color:#74534b}
.lista-cab{position:sticky;top:-18px;background:#fffaf5;padding:12px 4px 14px;z-index:2;text-align:center}
.lista-cab h2{margin:2px 0 5px;color:#9c5e58;font-size:28px;font-style:italic}
.lista-cab p{margin:0;font-size:14px}
.cerrar{position:absolute;right:15px;top:10px;border:0;background:#f4d7d4;color:#8f5554;width:36px;height:36px;border-radius:50%;font-size:22px;cursor:pointer}
.regalo{background:#fff;border:1px solid #efd8d1;border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 4px 14px rgba(90,55,50,.06)}
.regalo h3{margin:0 0 5px;color:#9c5e58;font-size:18px}
.regalo p{margin:3px 0;font-size:14px}
.estado{font-weight:bold;margin-top:8px!important}
.elegir{width:100%;border:0;border-radius:999px;padding:12px 14px;margin-top:10px;background:#cf7d85;color:white;font-weight:bold;font-size:15px;cursor:pointer}
.elegir[disabled]{background:#c9b7b3;cursor:default}
.cargando{text-align:center;padding:35px 10px;color:#9c5e58}
</style>

</head>
<body>
<main class="wrap">
<img class="art" src="diseno-lia.png" alt="Baby Shower de Lía Sofía. Gracias por confirmar.">
<div class="counter" aria-label="Cuenta regresiva para el Baby Shower">
<div class="unit"><span class="num" id="d">--</span><span class="lab">DÍAS</span></div>
<div class="unit"><span class="num" id="h">--</span><span class="lab">HORAS</span></div>
<div class="unit"><span class="num" id="m">--</span><span class="lab">MINUTOS</span></div>
<div class="unit"><span class="num" id="s">--</span><span class="lab">SEGUNDOS</span></div>
</div>
<div class="event-info"><div class="event-date">📅 &nbsp; SÁBADO 10 DE OCTUBRE DE 2026</div><div class="event-time">◷ &nbsp; 14:00 HRS</div></div>
<a class="gift-link" href="#lista-regalos" id="abrirLista" aria-label="Ver lista de regalos de Lía Sofía">Ver lista de regalos</a>
</main>
<script>
const target=new Date("2026-10-10T14:00:00-03:00").getTime();
function tick(){let x=target-Date.now();if(x<=0){["d","h","m","s"].forEach(i=>document.getElementById(i).textContent="00");return}
const D=86400000,H=3600000,M=60000;const d=Math.floor(x/D);x%=D;const h=Math.floor(x/H);x%=H;const m=Math.floor(x/M);x%=M;const s=Math.floor(x/1000);
[["d",d],["h",h],["m",m],["s",s]].forEach(([i,v])=>document.getElementById(i).textContent=String(v).padStart(2,"0"))}
tick();setInterval(tick,1000);
</script>

<div id="listaModal" role="dialog" aria-modal="true" aria-label="Lista de regalos de Lía Sofía">
  <div class="lista-panel">
    <div class="lista-cab">
      <button class="cerrar" id="cerrarLista" aria-label="Cerrar">×</button>
      <h2>Regalitos para Lía Sofía 🎀</h2>
      <p>Elige el detalle que quieras regalarle. Los que ya fueron seleccionados aparecerán como <b>Elegido ✓</b>.</p>
    </div>
    <div id="regalos"><div class="cargando">Cargando regalitos… 💕</div></div>
  </div>
</div>


<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyYi1vXRmspb0Hkh_I8SboW1Hkue2hVhnBqSZvU_09PgYz_UuBB2ZaJj1JJ7jcD7sSXNg/exec";
let cbN = 0;

function jsonp(params) {
  return new Promise((resolve, reject) => {
    const cb = "__lia_cb_" + (++cbN);
    const s = document.createElement("script");
    const q = new URLSearchParams(params);
    q.set("callback", cb);
    window[cb] = data => {
      resolve(data); delete window[cb]; s.remove();
    };
    s.onerror = () => { reject(new Error("No se pudo conectar")); delete window[cb]; s.remove(); };
    s.src = APPS_SCRIPT_URL + "?" + q.toString();
    document.body.appendChild(s);
    setTimeout(() => {
      if (window[cb]) { reject(new Error("Tiempo agotado")); delete window[cb]; s.remove(); }
    }, 15000);
  });
}

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

async function cargarRegalos() {
  const box = document.getElementById("regalos");
  box.innerHTML = '<div class="cargando">Cargando regalitos… 💕</div>';
  try {
    const data = await jsonp({accion:"listar"});
    if (!data.ok) throw new Error(data.mensaje || "Error");
    const items = (data.regalos || []).filter(r => r.producto);
    box.innerHTML = items.map(r => {
      const elegido = String(r.estado).trim().toLowerCase() === "elegido";
      return `<article class="regalo">
        <h3>${esc(r.producto)}</h3>
        ${r.descripcion ? `<p>${esc(r.descripcion)}</p>` : ""}
        ${r.categoria ? `<p><b>Categoría:</b> ${esc(r.categoria)}</p>` : ""}
        <p class="estado">${elegido ? "Elegido ✓" : "Disponible 💕"}</p>
        <button class="elegir" data-fila="${r.fila}" ${elegido ? "disabled" : ""}>
          ${elegido ? "Ya fue elegido" : "Elegir este regalo 🎁"}
        </button>
      </article>`;
    }).join("") || '<div class="cargando">No encontramos regalos para mostrar.</div>';
  } catch(e) {
    box.innerHTML = '<div class="cargando">No pudimos cargar la lista. Intenta nuevamente en unos segundos.</div>';
  }
}

document.getElementById("abrirLista").addEventListener("click", e => {
  e.preventDefault(); document.getElementById("listaModal").classList.add("abierto"); cargarRegalos();
});
document.getElementById("cerrarLista").addEventListener("click", () => document.getElementById("listaModal").classList.remove("abierto"));
document.getElementById("listaModal").addEventListener("click", e => { if(e.target.id==="listaModal") e.currentTarget.classList.remove("abierto"); });
document.getElementById("regalos").addEventListener("click", async e => {
  const b=e.target.closest(".elegir"); if(!b || b.disabled) return;
  if(!confirm("¿Quieres elegir este regalo para Lía Sofía? 💕")) return;
  b.disabled=true; b.textContent="Guardando…";
  try {
    const data=await jsonp({accion:"elegir",fila:b.dataset.fila});
    alert(data.mensaje || (data.ok ? "¡Regalo elegido! 💕" : "No se pudo elegir."));
    await cargarRegalos();
  } catch(err) {
    alert("No pudimos registrar el regalo. Intenta nuevamente.");
    b.disabled=false; b.textContent="Elegir este regalo 🎁";
  }
});
</script>

</body></html>
