<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faeee9">
<title>Baby Shower · Lía Sofía</title>
<style>
*{box-sizing:border-box} html,body{margin:0;background:#f7e9e4}
.wrap{width:min(100%,680px);margin:auto;position:relative;line-height:0}
.art{width:100%;height:auto;display:block}

/* El contador real se superpone exactamente sobre los números ilustrativos */
.counter{
 position:absolute; left:10.9%; right:10.9%; top:48.55%; height:8.15%;
 display:grid; grid-template-columns:repeat(4,1fr); gap:2.2%;
}
.unit{
 background:rgba(255,248,245,.98);
 border-radius:15%;
 display:flex; flex-direction:column; align-items:center; justify-content:center;
 line-height:1;
 box-shadow:0 0 0 1px rgba(255,255,255,.2) inset;
}
.num{
 color:#c86470; font-family:Georgia,"Times New Roman",serif;
 font-size:clamp(24px,7.2vw,49px); font-weight:700; line-height:1;
}
.lab{
 margin-top:9%; color:#985a59; font-family:Georgia,"Times New Roman",serif;
 font-size:clamp(7px,2.15vw,14px); letter-spacing:.08em; line-height:1;
}

/* Área clickeable encima del botón dibujado */
.gift-link{
 position:absolute; left:21.2%; right:20.6%; top:76.08%; height:8.2%;
 border-radius:999px; z-index:4;
 text-indent:-9999px; overflow:hidden;
}
.gift-link:focus{outline:3px solid #fff;outline-offset:-6px}

/* pequeña corrección: hora real del evento */
.time-cover{
 position:absolute; left:38%; right:36%; top:59.68%; height:2.35%;
 background:#f7d9d5; border-radius:999px;
 display:flex;align-items:center;justify-content:center;
 color:#965b59;font:700 clamp(8px,2.15vw,14px) Georgia,serif;
 line-height:1; letter-spacing:.03em;
}
@media(min-width:681px){
 .num{font-size:49px}.lab{font-size:14px}.time-cover{font-size:14px}
}
</style>
</head>
<body>
<main class="wrap">
<img class="art" src="diseno-lia.png" alt="Baby Shower de Lía Sofía. Gracias por confirmar.">
<div class="counter" aria-label="Cuenta regresiva para el Baby Shower">
 <div class="unit"><span class="num" id="d">--</span><span class="lab">DÍAS</span></div>
 <div class="unit"><span class="num" id="h">--</span><span class="lab">HORAS</span></div>
 <div class="unit"><span class="num" id="m">--</span><span class="lab">MINUTOS</span></div>
 <div class="unit"><span class="num" id="s">--</span><span class="lab">SEGUNDOS</span></div>
</div>
<div class="time-cover">◷ &nbsp;14:00 HRS</div>
<a class="gift-link" href="https://docs.google.com/spreadsheets/d/1cFKGVgrWxDSKnYzSUrQZnRokGS1UMSJPnWsyrJLsa2M/edit?gid=63163161#gid=63163161" target="_blank" rel="noopener noreferrer" aria-label="Ver lista de regalos de Lía Sofía">Ver lista de regalos</a>
</main>
<script>
const target = new Date("2026-10-10T14:00:00-03:00").getTime();
function tick(){
 let x=target-Date.now();
 if(x<=0){["d","h","m","s"].forEach(i=>document.getElementById(i).textContent="00");return}
 const D=86400000,H=3600000,M=60000;
 const d=Math.floor(x/D);x%=D;const h=Math.floor(x/H);x%=H;
 const m=Math.floor(x/M);x%=M;const s=Math.floor(x/1000);
 dEl=document.getElementById("d");dEl.textContent=String(d).padStart(2,"0");
 document.getElementById("h").textContent=String(h).padStart(2,"0");
 document.getElementById("m").textContent=String(m).padStart(2,"0");
 document.getElementById("s").textContent=String(s).padStart(2,"0");
}
tick();setInterval(tick,1000);
</script>
</body>
</html>
